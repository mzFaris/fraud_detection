[project]
name = "fraud-detection"
version = "0.1.0"
description = "Klasifikasi fraud transaksi kartu kredit dengan Random Forest dan SMOTE"
readme = "README.md"
requires-python = ">=3.10,<3.13"
authors = [
  { name = "Author Name", email = "author@example.com" }
]
dependencies = [
  "pandas==2.2.3",
  "numpy==1.26.4",
  "scipy==1.14.1",
  "matplotlib==3.9.2",
  "seaborn==0.13.2",
  "scikit-learn==1.5.2",
  "imbalanced-learn==0.12.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fraud_detection"]
